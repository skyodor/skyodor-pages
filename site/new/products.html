<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="ODOR 蝶漾香韻產品目錄，清楚分為 30ml 與 50ml 兩個產品系列。">
<title>產品系列｜ODOR 蝶漾香韻</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html"><strong>ODOR</strong><span>蝶漾香韻</span></a>
  <button class="menu" type="button" aria-label="開啟選單" aria-expanded="false">☰</button>
  <nav aria-label="主要導覽">
    <a href="index.html">首頁</a><a href="about.html">品牌與工藝</a>
    <a href="products.html" aria-current="page">產品</a><a href="lifestyle.html">品香生活</a>
    <a href="category.html">大香</a><a href="purchase-process.html">購買流程</a>
  </nav>
</header>
<main>
<section class="page-intro">
  <p class="eyebrow">THE COLLECTION</p>
  <h1>產品系列</h1>
  <p class="intro-copy">產品依容量分成兩條清楚的系列線：30ml 日常香水系列，以及 50ml 沉香香水系列。1ml 沉香油不混入香水系列。</p>
</section>

<section class="collection-section" id="collection-30ml">
  <div class="collection-heading">
    <div><p class="eyebrow">01 / DAILY COLLECTION</p><h2>30ml</h2></div>
    <p>以 C、L、P、S、N 系列整理來源產品。</p>
  </div>
  <div class="catalog-toolbar compact">
    <strong id="count30">—</strong>
    <div class="catalog-filter" role="group" aria-label="30ml 系列篩選">
      <button type="button" data-filter="ALL" class="is-active">全部</button>
      <button type="button" data-filter="C">C</button><button type="button" data-filter="L">L</button>
      <button type="button" data-filter="P">P</button><button type="button" data-filter="S">S</button>
      <button type="button" data-filter="N">N</button>
    </div>
  </div>
  <section class="catalog-grid" id="catalog30" aria-live="polite"></section>
</section>

<section class="collection-section" id="collection-50ml">
  <div class="collection-heading">
    <div><p class="eyebrow">02 / SIGNATURE COLLECTION</p><h2>50ml</h2></div>
    <p>獨立呈現 50ml 系列，不與 30ml 混排。</p>
  </div>
  <section class="catalog-grid catalog-grid-50" id="catalog50" aria-live="polite"></section>
</section>
</main>
<footer><span>ODOR 蝶漾香韻</span><a href="index.html">返回首頁 ↗</a></footer>
<script>
const menu=document.querySelector('.menu'),nav=document.querySelector('nav');
menu?.addEventListener('click',()=>{const open=nav.classList.toggle('open');menu.setAttribute('aria-expanded',String(open));});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const imageMarkup=(p)=>p.image
  ? '<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'" loading="lazy">'
  : '<div class="product-placeholder" aria-hidden="true">ODOR</div>';
const imageMarkup50=(p)=>p.images?.[0]
  ? '<img src="'+esc(p.images[0])+'" alt="'+esc(p.name)+'" loading="lazy">'
  : '<div class="product-placeholder" aria-hidden="true">50ml</div>';
let products30=[], products50=[];
function card30(p){
  return '<article class="catalog-card"><a href="product.html?code='+encodeURIComponent(p.code)+'&name='+encodeURIComponent(p.name)+'&size=30ml"><div class="catalog-image">'+imageMarkup(p)+'<span class="catalog-code">'+esc(p.code)+'</span></div><div class="catalog-copy"><div><h3>'+esc(p.name)+'</h3><p class="product-meta">30ml · NT$'+esc(p.price_twd)+'</p></div>'+(p.notes?'<p class="product-notes">'+esc(p.notes)+'</p>':'')+'</div></a></article>';
}
function card50(p){
  return '<article class="catalog-card catalog-card-signature"><a href="product.html?id='+encodeURIComponent(p.id)+'"><div class="catalog-image">'+imageMarkup50(p)+'<span class="catalog-code">50ml</span></div><div class="catalog-copy"><div><h3>'+esc(p.name)+'</h3><p class="product-meta">50ml · NT$'+esc(p.price_twd)+'</p></div>'+(p.notes?'<p class="product-notes">'+esc(p.notes.split('\n')[0])+'</p>':'')+'</div></a></article>';
}
function render30(filter='ALL'){
  const list=filter==='ALL'?products30:products30.filter(p=>String(p.code||'').replace('NO.','').charAt(0)===filter);
  document.querySelector('#count30').textContent=list.length+' ITEMS';
  document.querySelector('#catalog30').innerHTML=list.map(card30).join('');
}
document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('[data-filter]').forEach(b=>b.classList.remove('is-active'));
  btn.classList.add('is-active'); render30(btn.dataset.filter);
}));
Promise.all([
  fetch('content/product-catalog.json').then(r=>r.json()),
  fetch('content/product-50ml.json').then(r=>r.json())
]).then(([a,b])=>{
  products30=(a.products||[]).filter(p=>p.size==='30ml');
  products50=b.products||[];
  render30();
  document.querySelector('#catalog50').innerHTML=products50.map(card50).join('');
}).catch(()=>{
  document.querySelector('#catalog30').innerHTML='<p>產品資料目前無法載入。</p>';
  document.querySelector('#catalog50').innerHTML='<p>產品資料目前無法載入。</p>';
});
</script>
</body>
</html>
