<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="蝶漾香韻產品系列｜ODOR">
<title>產品｜ODOR 蝶漾香韻</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header"><a class="brand" href="index.html"><strong>ODOR</strong><span>蝶漾香韻</span></a><button class="menu" aria-label="開啟選單" aria-expanded="false">☰</button><nav><a href="index.html#about">品牌</a><a href="products.html" aria-current="page">產品</a><a href="index.html#materials">基調</a><a href="index.html#craft">工藝</a></nav></header>
<main>
<section class="closing"><p class="eyebrow">THE COLLECTION</p><h1>香氣的<br><span>不同章節</span></h1><p>以下列出來源清單中已編錄的產品名稱、規格與價格。尚未核對的詳細描述與圖片不自行補寫。</p></section>
<section class="product-grid" id="catalog" aria-live="polite"><p>正在載入產品清單……</p></section>
</main>
<footer><span>ODOR 蝶漾香韻</span><a href="index.html">返回首頁 ↗</a></footer>
<script>
const menu=document.querySelector('.menu');
const nav=document.querySelector('nav');
menu.addEventListener('click',()=>{const open=nav.classList.toggle('open');menu.setAttribute('aria-expanded',String(open));});
fetch('content/inventory.json').then(r=>r.json()).then(data=>{
  const catalog=document.querySelector('#catalog'); catalog.replaceChildren();
  (data.products||[]).forEach(product=>{
    const card=document.createElement('article'); card.className='product';
    const code=document.createElement('p'); code.className='eyebrow'; code.textContent=product.code;
    const title=document.createElement('h2'); title.textContent=product.name;
    const details=document.createElement('p'); details.textContent=[product.size, product.price_twd ? '$'+product.price_twd : ''].filter(Boolean).join(' · ');
    card.append(code,title,details); catalog.append(card);
  });
}).catch(()=>{document.querySelector('#catalog').textContent='產品清單目前無法載入，請稍後再試。';});
</script>
</body></html>
