<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="ODOR 蝶漾香韻完整產品目錄：來源核對的產品名稱、規格、價格與香氣資料。">
<title>完整產品目錄｜ODOR 蝶漾香韻</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html"><strong>ODOR</strong><span>蝶漾香韻</span></a>
  <button class="menu" type="button" aria-label="開啟選單" aria-expanded="false">☰</button>
  <nav aria-label="主要導覽">
    <a href="index.html">首頁</a><a href="about.html">品牌與工藝</a>
    <a href="products.html" aria-current="page">完整產品</a><a href="lifestyle.html">品香生活</a>
    <a href="category.html">大香</a><a href="purchase-process.html">購買流程</a>
  </nav>
</header>
<main>
<section class="page-intro">
  <p class="eyebrow">THE COLLECTION / 01</p>
  <h1>完整產品目錄</h1>
  <p class="intro-copy">來源資料已整理成可瀏覽的產品卡。產品名稱、規格與價格沿用已核對的來源資料；香氣資料則只顯示來源頁已提供的內容。</p>
</section>
<section class="catalog-toolbar">
  <div><span class="eyebrow">COLLECTION</span><strong id="count">—</strong></div>
  <div class="catalog-filter" role="group" aria-label="產品系列篩選">
    <button type="button" data-filter="ALL" class="is-active">全部</button>
    <button type="button" data-filter="C">C 系列</button>
    <button type="button" data-filter="L">L 系列</button>
    <button type="button" data-filter="P">P 系列</button>
    <button type="button" data-filter="S">S 系列</button>
    <button type="button" data-filter="N">N 系列</button>
  </div>
</section>
<section class="catalog-grid" id="catalog" aria-live="polite"></section>
</main>
<footer><span>ODOR 蝶漾香韻</span><a href="index.html">返回首頁 ↗</a></footer>
<script>
const menu=document.querySelector('.menu'),nav=document.querySelector('nav');
menu?.addEventListener('click',()=>{const open=nav.classList.toggle('open');menu.setAttribute('aria-expanded',String(open));});
const catalog=document.querySelector('#catalog'), count=document.querySelector('#count');
let products=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(filter='ALL'){
  const list=filter==='ALL'?products:products.filter(p=>String(p.code||'').replace('NO.','').charAt(0)===filter);
  count.textContent=list.length+' ITEMS';
  catalog.innerHTML=list.map(p=>{
    const series=(p.code||'').replace('NO.','').charAt(0);
    const img=p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'" loading="lazy">':'<div class="product-placeholder" aria-hidden="true">'+esc(series)+'</div>';
    const notes=p.notes?'<p class="product-notes">'+esc(p.notes)+'</p>':'';
    return '<article class="catalog-card"><a href="product.html?code='+encodeURIComponent(p.code)+'&name='+encodeURIComponent(p.name)+'">'+
      '<div class="catalog-image">'+img+'<span class="catalog-code">'+esc(p.code)+'</span></div>'+
      '<div class="catalog-copy"><div><h2>'+esc(p.name)+'</h2><p class="product-meta">'+esc(p.size||'')+(p.price_twd!=null?' · NT$'+esc(p.price_twd):'')+'</p></div>'+notes+'</div></a></article>';
  }).join('');
}
document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(b=>b.classList.remove('is-active'));btn.classList.add('is-active');render(btn.dataset.filter);}));
fetch('content/product-catalog.json').then(r=>r.json()).then(d=>{products=d.products||[];render();}).catch(()=>{catalog.innerHTML='<p>產品資料目前無法載入。</p>';});
</script>
</body>
</html>
