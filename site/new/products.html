<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="蝶漾香韻產品目錄｜來源資料核對頁。">
<title>產品目錄｜ODOR 蝶漾香韻</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header"><a class="brand" href="index.html"><strong>ODOR</strong><span>蝶漾香韻</span></a><button class="menu" aria-label="開啟選單" aria-expanded="false">☰</button><nav><a href="index.html">首頁</a><a href="about.html">品牌與工藝</a><a href="products.html" aria-current="page">產品</a><a href="purchase.html">購買流程</a></nav></header>
<main>
<section class="closing"><p class="eyebrow">PRODUCT CATALOG</p><h1>產品目錄</h1><p>以下列出來源清單中已編錄的產品名稱、規格與價格。尚未核對的詳細描述與圖片不自行補寫。</p></section>
<section class="product-grid" id="catalog" aria-live="polite"><p>正在載入產品清單……</p></section>
</main>
<footer><span>ODOR 蝶漾香韻</span><a href="index.html">返回首頁 ↗</a></footer>
<script>
const menu=document.querySelector('.menu');
const nav=document.querySelector('nav');
menu.addEventListener('click',()=>{const open=nav.classList.toggle('open');menu.setAttribute('aria-expanded',String(open));});
fetch('content/inventory.json').then(r=>{if(!r.ok)throw new Error('catalog unavailable');return r.json();}).then(data=>{
  const catalog=document.querySelector('#catalog'); catalog.replaceChildren();
  (data.products||[]).forEach(product=>{
    const card=document.createElement('article'); card.className='product';
    const link=document.createElement('a'); link.href='product.html?code='+encodeURIComponent(product.code||''); link.className='product-link';
    const code=document.createElement('p'); code.className='eyebrow'; code.textContent=product.code||'未提供';
    const title=document.createElement('h2'); title.textContent=product.name||'未提供';
    const details=document.createElement('p'); details.textContent=[product.size, product.price_twd != null ? '$'+product.price_twd : ''].filter(Boolean).join(' · ') || '規格與價格尚未核對';
    link.append(code,title,details); card.append(link); catalog.append(card);
  });
  if(!data.products || data.products.length===0) catalog.textContent='目前沒有可顯示的產品資料。';
}).catch(()=>{document.querySelector('#catalog').textContent='產品清單目前無法載入，請稍後再試。';});
</script>
</body></html>
