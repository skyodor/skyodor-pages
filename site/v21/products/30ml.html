<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>30ml｜產品線｜蝶漾香韻</title><meta name="description" content="蝶漾香韻 30ml 產品線與相關產品。"><link rel="stylesheet" href="../styles.css"></head><body><header class="site-header"><a class="brand" href="../index.html"><strong>ODOR</strong><span>蝶漾香韻</span></a><button class="menu" type="button" aria-label="開啟選單" aria-expanded="false">☰</button><nav aria-label="主要導覽"></nav></header><main><section class="page-hero"><p class="eyebrow">PRODUCT LINE / 30ML</p><h1>30ml</h1><p>30ml 產品線資訊與相關產品。每項產品仍由唯一的 canonical product ID 管理，不因產品線而複製。</p></section><section class="collection-section"><div class="catalog-toolbar compact"><strong id="count">—</strong></div><section class="catalog-grid" id="catalog" aria-live="polite"></section></section></main><footer class="site-footer"><p>ODOR 蝶漾香韻</p><a href="../products.html">查看全部產品 ↗</a></footer><script src="../navigation.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('../content/inventory.json').then(r=>r.json()).then(d=>{const list=(d.products||[]).filter(p=>(p.formats||[]).includes('30ml'));document.querySelector('#count').textContent=list.length+' ITEMS';document.querySelector('#catalog').innerHTML=list.map(p=>'<article class="catalog-card"><a href="../product.html?code='+encodeURIComponent(p.code)+'"><div class="catalog-image">'+(p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'" loading="lazy">':'<div class="product-placeholder" aria-hidden="true">ODOR</div>')+'<span class="catalog-code">'+esc(p.code)+'</span></div><div class="catalog-copy"><h3>'+esc(p.name)+'</h3><p class="product-meta">'+esc((p.formats||[]).join(' · '))+(p.price_twd!=null?' · NT$'+esc(p.price_twd):'')+'</p></div></a></article>').join('')||'<p>目前沒有可顯示的產品。</p>';}).catch(()=>document.querySelector('#catalog').innerHTML='<p>產品資料目前無法載入。</p>');</script></body></html>
