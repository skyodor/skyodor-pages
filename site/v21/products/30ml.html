['NO.C8','2008',2450,'s-207052814.jpg',`還記得 我剛從新加坡回來\n第一次搭頭等艙\n第一次搭台灣高鐵\n當年的義大世界還在建構中\n一片荒野蔓草\n我陪著朋友勘查建案進度直到深夜\n獨自漫步於荒郊野林的崎嶇道路\n路間雜草叢生\n竟飄著淡淡的草木和桂花香…\n是一種無忽近忽遠的親切和感動\n在這個熟悉又陌生的我的家鄉 台灣\n\n那一夜無法成眠\n所有感覺全刻進了心底\n\n那是2008年 也是我想送給你的記花香\n敬友誼 我的「2008」`],

{key:'LOVER',header:'lover_orig.jpg',items:[

{key:'PLANT',header:'1001009257_orig.jpg',items:[

['NO.P2','茉莉花季',2450,'bibi-pace-lzbgmtwt5ey-unsplash.jpg',`解開妳的迷\n總在夜裡想起\n那天選擇勇敢面對的自己\n不願負了妳的真心真意\n每個茉莉花季\n特別掛念妳\n妳義無反顧溫暖了我的心\n讓我只留下深刻美好的回憶`],

['NO.P8','雪茄菸草',2450,'pexels-photo-1637114.jpeg',`優雅紳士不凡的氣質，品味不等於名利權力財富，反倒是品味講究是生活態度，給人一種暖暖的溫度，從裡而外散發的魅力和氣質，這是無法拒絕的雪茄氣味。`],
['NO.P9','絕妙玫瑰',2450,'s-205955079.jpg',`從花瓣間散發淡淡迷人的氣息是由心發出的美\n幽微又神秘\n那美麗是一份良善\n默默守護彼此那顆心\n從心底傳到另一端\n藉玫瑰成為彼此的羈絆`],
['NO.P10','韶光',2450,'s-6717639.jpg',`微涼薄霧瀰漫間\n日光乍現\n指尖輕撫嫩綠新葉的朝露\n粉紅嬌媚的花苞初綻\n正伸起胳膊擁抱天空\n在櫻花與桃花\n淡雅清新的香甜氣息中甦醒\n掬一縷脫俗風格\n帶著純然輕盈的初心\n踏上嶄新旅程`],
['NO.P11','戀玫瑰',3200,'1678867803690.jpg',`一股清高悠然的氣質\n反骨孤冷\n你讓所有人無法自拔著迷\n因為過去\n讓你多刺\n你只做你自己\n冰清玉潔 淡雅飄香\n用獨特的美震懾所有人\n你就是讓人不要命\n都要愛上的戀玫瑰`],
['NO.P12','關聖帝君沉香香水',3000,'s-32284686.jpg',`安定靈魂 養護元神\n護身避煞 常保平安\n淨身淨地 穩定磁場\n加強除穢 靈體防護`]

{key:'STYLE',header:'154873243_orig.jpg',items:[

['NO.S7','檀魂',3000,'s-214745099.jpg',`在生活瑣碎裡循環\n喜怒哀樂無常與無預警\n都隱藏在日常當中\n\n查不出的病痛纏身\n三個多月的日子\n從抱著一絲希望\n到畏懼最後的無奈\n\n百轉千折後一份祝福點亮了生命三個多月只能在苦中作樂\n細細品嘗香氣所帶來的\n美好和一份平安\n就在絕境的低潮中\n神奇微妙的香調就此出現`],
['NO.S8','旅人',2600,'d7d6b47b-d68a-421d-b1ae-87333cf24d18.jpg',`迷霧飄散\n阿波羅耀眼溫暖的\n香榭大道櫻花飛舞\n艾菲爾的時尚浪漫\n哈里發塔沙哇滴卡\n轉身問候泰姬瑪哈陵阿里卡多\n洄游感恩台北101\n\n「旅人」環遊世界\n但不忘根留故鄉....`]

{key:'NATURE',header:'1294541233_orig.jpg',items:[

['NO.N2','蔚海藍天',2450,'498942889.jpg',`下著大雪 雙手凍到撕裂\n你拿出一瓶金黃色的油\n為我的雙手塗抹\n特別熟悉的味道 金盞花油\n從天黑飛到天亮\n坐著變擁在我身邊\n被一道太陽光打醒的你我\n在我耳朵旁說著\n為什麼總是走不進你的心\n你就像天空 我就像海\n\n你往下看那片海\n每一個人看見海的同時\n也看見在大海中的天空\n我們守護著對方沒有離開過`],

['NO.N4','曙光九號',2450,'casey-horner-d4toocieyf4-unsplash.jpg',`馬勒充滿凋零緊湊枯萎的\n第九號交響曲\n濃烈淒美的死亡\n一如心碎戀情的感傷\n而曙光如死後新生的勇氣\n一種沈澱後的呼吸\n感受著生機與朝氣`],
