<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ODOR 蝶漾香韻全部產品目錄。產品以 canonical product ID 管理，30ml、50ml 與 50ml X 不重複建立產品。"><title>全部產品｜ODOR 蝶漾香韻</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><strong>ODOR</strong><span>蝶漾香韻</span></a><button class="menu" type="button" aria-label="開啟選單" aria-expanded="false">☰</button><nav aria-label="主要導覽"></nav></header><main><section class="page-intro"><p class="eyebrow">ALL PRODUCTS</p><h1>全部產品</h1><p class="intro-copy">這是唯一的 canonical product catalogue。產品可以屬於不同產品線或規格，但同一產品只保留一份 canonical record，不因集合而重複。</p></section><section class="collection-section"><div class="catalog-toolbar compact"><strong id="count">—</strong><div class="catalog-filter" role="group" aria-label="產品線篩選"><button type="button" data-filter="ALL" class="is-active">全部</button><button type="button" data-filter="30ml">30ml</button><button type="button" data-filter="50ml">50ml</button><button type="button" data-filter="50ml X">50ml X</button></div></div><section class="catalog-grid" id="catalog" aria-live="polite"></section></section></main><footer><span>ODOR 蝶漾香韻</span><a href="index.html">返回首頁 ↗</a></footer><script src="navigation.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let products=[];
function card(p){const format=(p.formats||[]).join(' · ');return '<article class="catalog-card"><a href="product.html?code='+encodeURIComponent(p.code)+'"><div class="catalog-image">'+(p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'" loading="lazy">':'<div class="product-placeholder" aria-hidden="true">ODOR</div>')+'<span class="catalog-code">'+esc(p.code)+'</span></div><div class="catalog-copy"><h3>'+esc(p.name)+'</h3><p class="product-meta">'+esc(format)+(p.price_twd!=null?' · NT$'+esc(p.price_twd):'')+'</p></div></a></article>';}
function render(filter='ALL'){const list=filter==='ALL'?products:products.filter(p=>(p.formats||[]).includes(filter));document.querySelector('#count').textContent=list.length+' ITEMS';document.querySelector('#catalog').innerHTML=list.map(card).join('')||'<p>目前沒有可顯示的產品。</p>';}
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('is-active'));b.classList.add('is-active');render(b.dataset.filter);}));fetch('content/inventory.json').then(r=>r.json()).then(data=>{products=data.products||[];render();}).catch(()=>{document.querySelector('#catalog').innerHTML='<p>產品資料目前無法載入。</p>';});
</script></body></html>
