<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ODOR 蝶漾香韻產品詳細資料。"><title>產品詳細資料｜ODOR 蝶漾香韻</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><strong>ODOR</strong><span>蝶漾香韻</span></a><button class="menu" type="button" aria-label="開啟選單" aria-expanded="false">☰</button><nav aria-label="主要導覽"></nav></header><main id="detail" class="detail-page"></main><footer><span>ODOR 蝶漾香韻</span><a href="products.html">返回全部產品 ↗</a></footer><script src="navigation.js"></script><script>
const q=new URLSearchParams(location.search),code=q.get('code');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const nl=s=>esc(s).replace(/\n/g,'<br>');
function render(p,copy){if(!p){document.querySelector('#detail').innerHTML='<section class="page-intro"><p class="kicker">PRODUCT</p><h1>找不到產品</h1><a class="button button-dark" href="products.html">返回全部產品 ↗</a></section>';return;}document.title=p.name+'｜ODOR 蝶漾香韻';const images=p.image?[p.image]:[];const gallery=images.length?'<div class="detail-gallery">'+images.map(src=>'<img src="'+esc(src)+'" alt="'+esc(p.name)+'">').join('')+'</div>':'<div class="detail-placeholder">ODOR</div>';const formats=(p.formats||[]).join(' · ');const price=p.price_twd!=null?'<p class="detail-price">'+esc(formats)+'　NT$'+esc(p.price_twd)+'</p>':'';const description=copy?.description||p.notes||'';const source=copy?.source||'來源資料庫';document.querySelector('#detail').innerHTML='<section class="detail-hero"><div class="detail-image">'+gallery+'</div><div class="detail-copy"><p class="kicker">'+esc(p.code)+'</p><h1>'+esc(p.name)+'</h1>'+price+(description?'<div class="detail-section"><span class="kicker">產品故事與資料</span><p>'+nl(description)+'</p></div>':'')+(p.notes&&copy?.description?'<div class="detail-section"><span class="kicker">香氣筆記</span><p>'+nl(p.notes)+'</p></div>':'')+(p.source_conflict?'<div class="detail-section"><span class="kicker">資料核對</span><p>'+nl(p.source_conflict)+'</p></div>':'')+'<div class="detail-section"><span class="kicker">資料來源</span><p>'+esc(source)+'</p></div><a class="button button-dark" href="products.html">返回全部產品 <span>↗</span></a></div></section>';}
Promise.all([fetch('content/inventory.json').then(r=>r.json()),fetch('content/product-copy.json').then(r=>r.json())]).then(([data,c])=>{const p=(data.products||[]).find(x=>x.code===code);const copy=(c.products||{})[code];render(p,copy);}).catch(()=>{document.querySelector('#detail').innerHTML='<section class="page-intro"><h1>產品資料無法載入</h1></section>';});
</script></body></html>
