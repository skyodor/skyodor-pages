name: Deploy V1.2 preview

on:
  push:
    branches: [v1.2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v1-2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload V1.2 site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy V1.2
        id: deployment
        uses: actions/deploy-pages@v4
