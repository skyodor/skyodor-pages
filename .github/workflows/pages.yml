name: Deploy Skyodor versioned sites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install new-site validation dependency
        run: python -m pip install beautifulsoup4

      - name: Validate standalone new site
        run: python scripts/validate_new_site.py

      - name: Prepare existing versioned sites and new site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/v1.1 deploy/v1.2 deploy/v03 deploy/new
          cp -a site/v1.1/. deploy/v1.1/
          cp -a site/v1.2/. deploy/v1.2/
          cp -a site/v03/. deploy/v03/
          cp -a site/new/. deploy/new/
          touch deploy/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload sites
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy sites
        id: deployment
        uses: actions/deploy-pages@v4
