name: Deploy Skyodor v1.1 Live

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload v1.1 site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/v1.1

      - name: Deploy v1.1
        id: deployment
        uses: actions/deploy-pages@v4
