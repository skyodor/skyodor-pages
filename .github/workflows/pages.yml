name: Deploy Skyodor versioned sites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install validation dependency
        run: python -m pip install beautifulsoup4

      - name: Validate v2.1 portable static site
        run: |
          python scripts/validate_static_site.py site/v21
          if grep -RInE 'https?://(www\\.)?skyodor\\.com|https?://skyodor\\.github\\.io|/site/v21/|/site/new/' site/v21 --include='*.html' --include='*.css' --include='*.js'; then
            echo 'ERROR: v2.1 contains a hard-coded internal/deployment URL.'
            exit 1
          fi

      - name: Validate legacy new site
        run: python scripts/validate_new_site.py

      - name: Prepare versioned sites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/v1.1 deploy/v1.2 deploy/v03 deploy/v1.3 deploy/new deploy/v21
          cp -a site/v1.1/. deploy/v1.1/
          cp -a site/v1.2/. deploy/v1.2/
          cp -a site/v03/. deploy/v03/
          cp -a v1.3/. deploy/v1.3/
          cp -a site/new/. deploy/new/
          cp -a site/v21/. deploy/v21/
          touch deploy/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload sites
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy sites
        id: deployment
        uses: actions/deploy-pages@v4
