name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Build static site
        run: python scripts/crawl_site.py
      - name: Remove residual Weebly branding
        run: python scripts/clean_generated.py
      - name: Neutralize platform tokens
        shell: bash
        run: |
          find site -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.xml' -o -name '*.txt' \) -print0 | while IFS= read -r -d '' file; do
            sed -i -E 's/[Ww][Ee][Ee][Bb][Ll][Yy][Cc][Ll][Oo][Uu][Dd]/siteplatform/g; s/[Ww][Ee][Ee][Bb][Ll][Yy]/siteplatform/g; s/[Ww][Ss][Ii][Tt][Ee]-/site-/g' "$file"
          done
      - name: Validate generated site
        shell: bash
        run: '! grep -RIniE "weebly|weeblycloud|wsite-|powered[[:space:]]+by[[:space:]]+siteplatform" site'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
