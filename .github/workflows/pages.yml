name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Build current site baseline
        run: python scripts/crawl_site.py
      - name: Clean generated baseline
        run: python scripts/clean_generated.py
      - name: Place baseline under site/v0.1
        shell: bash
        run: |
          mkdir -p site/v0.1
          shopt -s dotglob
          for item in site/*; do
            if [ "$(basename "$item")" != "v0.1" ]; then
              mv "$item" site/v0.1/
            fi
          done
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=v0.1/">
            <link rel="canonical" href="v0.1/">
            <meta name="robots" content="noindex, nofollow, noarchive">
            <title>Skyodor</title>
          </head>
          <body><a href="v0.1/">Continue to Skyodor</a></body>
          </html>
          EOF
      - name: Add noindex metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          for path in Path('site').rglob('*.html'):
              soup = BeautifulSoup(path.read_text(encoding='utf-8', errors='replace'), 'html.parser')
              head = soup.head or soup.insert(0, soup.new_tag('head'))
              existing = head.find('meta', attrs={'name': 'robots'})
              if existing:
                  existing['content'] = 'noindex, nofollow, noarchive'
              else:
                  tag = soup.new_tag('meta', attrs={'name': 'robots', 'content': 'noindex, nofollow, noarchive'})
                  head.insert(0, tag)
              path.write_text(str(soup), encoding='utf-8')
          PY
      - name: Validate versioned baseline
        shell: bash
        run: |
          test -f site/v0.1/index.html
          test -f site/index.html
          test "$(grep -RIl 'name="robots"' site --include='*.html' | wc -l)" -gt 0
          ! grep -RIniE "weebly|weeblycloud|powered[[:space:]]+by[[:space:]]+weebly" site --include="*.html"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
