name: Deploy Skyodor versioned sites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install validation dependency
        run: python -m pip install beautifulsoup4

      - name: Validate v2.1 portable static site
        run: |
          python scripts/validate_static_site.py site/v21
          if grep -RInE 'https?://(www\\.)?skyodor\\.com|https?://skyodor\\.github\\.io|/site/v21/|/site/new/|chatgpt\\.com|openai\\.com' site/v21 --include='*.html' --include='*.css' --include='*.js' --include='*.json' --include='*.md'; then
            echo 'ERROR: v2.1 contains a forbidden domain, deployment URL, or ChatGPT/OpenAI reference.'
            exit 1
          fi

      - name: Verify v2.1 referenced assets
        run: |
          python scripts/build_new_site_asset_manifest.py --source site/v21 --output /tmp/v21-asset-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('/tmp/v21-asset-manifest.json').read_text(encoding='utf-8'))
          missing = [item for item in manifest['assets'] if not item['exists']]
          print(f"v2.1 source image references: {manifest['asset_count']}")
          print(f"v2.1 unresolved image references: {len(missing)}")
          if missing:
              for item in missing:
                  print(f"- {item['source_page']}: {item['reference']}")
              raise SystemExit('ERROR: v2.1 has unresolved image references')
          print('v2.1 source asset existence + SHA-256 verification: PASS')
          PY

      - name: Validate legacy new site
        run: python scripts/validate_new_site.py

      - name: Prepare versioned sites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/v1.1 deploy/v1.2 deploy/v03 deploy/v1.3 deploy/new deploy/v21
          cp -a site/v1.1/. deploy/v1.1/
          cp -a site/v1.2/. deploy/v1.2/
          cp -a site/v03/. deploy/v03/
          cp -a v1.3/. deploy/v1.3/
          cp -a site/new/. deploy/new/
          cp -a site/v21/. deploy/v21/
          python scripts/apply_v21_navigation.py
          cp -a site/v21/. deploy/v21/
          touch deploy/.nojekyll

      - name: Validate generated v2.1 deployment tree
        run: python scripts/validate_static_site.py deploy/v21

      - name: Verify generated v2.1 referenced assets
        run: |
          python scripts/build_new_site_asset_manifest.py --source deploy/v21 --output /tmp/deploy-v21-asset-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('/tmp/deploy-v21-asset-manifest.json').read_text(encoding='utf-8'))
          missing = [item for item in manifest['assets'] if not item['exists']]
          print(f"generated v2.1 image references: {manifest['asset_count']}")
          print(f"generated v2.1 unresolved image references: {len(missing)}")
          if missing:
              for item in missing:
                  print(f"- {item['source_page']}: {item['reference']}")
              raise SystemExit('ERROR: generated v2.1 has unresolved image references')
          print('generated v2.1 asset existence + SHA-256 verification: PASS')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload sites
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy sites
        id: deployment
        uses: actions/deploy-pages@v4
