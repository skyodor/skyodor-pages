name: Deploy Skyodor versioned sites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare versioned sites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/v1.1 deploy/v1.2 deploy/v03
          cp -a site/v1.1/. deploy/v1.1/
          cp -a site/v1.2/. deploy/v1.2/
          cp -a site/v03/. deploy/v03/
          touch deploy/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload versioned sites
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy versioned sites
        id: deployment
        uses: actions/deploy-pages@v4
