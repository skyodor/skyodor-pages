name: Commit generated site baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm preserved baseline
        run: |
          test -f site/v0.1/index.html
          echo "site/v0.1 is preserved as a committed legacy baseline."
