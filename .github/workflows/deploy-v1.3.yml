name: Deploy v1.3 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'v1.3/**'
      - '.github/workflows/deploy-v1.3.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v1.3
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage v1.3 under its URL folder
        run: |
          rm -rf _pages
          mkdir -p _pages
          cp -R v1.3 _pages/v1.3
      - name: Upload v1.3 artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_pages'
    
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
