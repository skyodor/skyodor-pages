name: Deploy v1.3 to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v1.3
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Stage v1.3 under its URL folder
        run: |
          rm -rf _pages
          mkdir -p _pages
          cp -R v1.3 _pages/v1.3
      - name: Upload v1.3 artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: './_pages'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
