name: Publish Skyodor versioned sites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-versioned
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish versioned sites under version paths
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          mkdir -p "$tmp_dir/v1.1" "$tmp_dir/v1.2" "$tmp_dir/v03"
          cp -a site/v1.1/. "$tmp_dir/v1.1/"
          cp -a site/v1.2/. "$tmp_dir/v1.2/"
          cp -a site/v03/. "$tmp_dir/v03/"
          touch "$tmp_dir/.nojekyll"
          cd "$tmp_dir"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy versioned sites including V03"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
